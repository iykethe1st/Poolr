packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
allowBuilds:
  '@firebase/util': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  bcrypt: true
  esbuild: true
  firebase-admin: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@11.0.22'
  - '@nestjs/common@11.1.25'
  - '@nestjs/core@11.1.25'
  - '@nestjs/platform-express@11.1.25'
  - '@nestjs/testing@11.1.25'
  - expo-build-properties@56.0.20
  - expo-asset@56.0.25
  - expo-constants@56.0.27
  - expo-modules-core@56.0.27
  - expo-modules-jsi@56.0.14
  - expo@56.0.23
  - expo-notifications@56.0.26
