packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
allowBuilds:
  '@firebase/util': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  firebase-admin: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@11.0.22'
  - '@nestjs/common@11.1.25'
  - '@nestjs/core@11.1.25'
  - '@nestjs/platform-express@11.1.25'
  - '@nestjs/testing@11.1.25'
